.wrap{max-width:1180px;padding:8px 24px 70px}

.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid #64748b;border-radius:14px;color:var(--txt);box-shadow:none}

.card.warn{border-left-color:var(--warn);box-shadow:0 10px 30px -14px var(--warn)}.card.hint{border-left-color:var(--hint);box-shadow:0 10px 30px -16px var(--hint)}

<script type="text/js-worker" id="wsrc">/* Rotorflight/Betaflight Blackbox (BBL) Parser - Nachbau der Logik von blackbox_decode (blackbox-tools).
   Liefert pro Log: header, names, n, cols{name: Float64Array}. Werte wie in der CSV von blackbox_decode (roh). */
(function (root) {
  'use strict';
  var ENC = { SVB: 0, UVB: 1, NEG14: 3, ED_U: 4, ED_S: 5, T8_8SVB: 6, T2_3S32: 7, T8_4S16: 8, NUL: 9, EG_U: 10, EG_S: 11 };
  var MAX_FRAME_LEN = 256, MAX_ITER_JUMP = 500 * 10, MAX_TIME_JUMP = 10 * 1000 * 1000;
  var MARKERS = { 73: 'I', 80: 'P', 71: 'G', 72: 'H', 83: 'S', 69: 'E' };

  function sx(v, bits) { var s = 32 - bits; return (v << s) >> s; }

  function parseOne(data, start, end) {
    var pos = start, hdr = {}, defs = {};
    function def(t) { return defs[t] || (defs[t] = { names: [], signed: [], pred: [], enc: [], n: 0 }); }
    function ints(s) { return s.split(',').map(function (x) { var v = parseInt(x, 10); return isNaN(v) ? 0 : v; }); }
    // ---- Header ----
    while (pos < end && data[pos] === 72 && data[pos + 1] === 32) {
      var e = pos; while (e < end && data[e] !== 10) e++;
      var line = ''; for (var i = pos + 2; i < e; i++) line += String.fromCharCode(data[i]);
      pos = e + 1;
      var c = line.indexOf(':'); if (c < 0) continue;
      var k = line.slice(0, c).trim(), v = line.slice(c + 1).trim();
      hdr[k] = v;
      if (k.indexOf('Field ') === 0) {
        var ft = k.charAt(6), d = def(ft);
        if (/ name$/.test(k)) { d.names = v.split(','); d.n = d.names.length; if (ft === 'I') { def('P').names = d.names; def('P').n = d.n; } }
        else if (/ signed$/.test(k)) { d.signed = ints(v); if (ft === 'I') def('P').signed = d.signed; }
        else if (/ predictor$/.test(k)) d.pred = ints(v);
        else if (/ encoding$/.test(k)) d.enc = ints(v);
      }
    }
    var I = defs.I; if (!I || !I.n) throw new Error('Keine Feld-Definitionen im Log');
    var cfg = { frameIntervalI: Math.max(1, parseInt(hdr['I interval'], 10) || 32), pNum: 1, pDen: 1,
                dataVersion: parseInt(hdr['Data version'], 10) || 0, minthrottle: parseInt(hdr['minthrottle'], 10) || 0,
                vbatref: parseInt(hdr['vbatref'], 10) || 0, motorOutputLow: 0 };
    var pi = hdr['P interval']; if (pi && pi.indexOf('/') > 0) { cfg.pNum = parseInt(pi, 10); cfg.pDen = parseInt(pi.split('/')[1], 10); }
    cfg.motorOutputLow = cfg.minthrottle;
    if (hdr['motorOutput']) cfg.motorOutputLow = parseInt(hdr['motorOutput'].split(',')[0], 10) || 0;

    var names = I.names.slice(), nMain = I.n, S = defs.S, nSlow = S ? S.n : 0;
    var allNames = names.concat(S ? S.names : []);
    var iTime = names.indexOf('time'), iIter = names.indexOf('loopIteration'), iMotor0 = names.indexOf('motor[0]');
    // ---- Spaltenspeicher ----
    var cap = 1 << 14, ncol = nMain + nSlow, cols = []; for (var q = 0; q < ncol; q++) cols.push(new Float64Array(cap));
    var nrows = 0;

      for (var q = 0; q < nMain; q++) cols[q][nrows] = frame[q];
      for (var s = 0; s < nSlow; s++) cols[nMain + s][nrows] = slow[s];

  var DATA = null, CUR = 0, TAB = 0, TABS = null, ROTOR = window.__ROTOR__ || '', worker = null;
  function msg(t, err, spin) { $('hero').innerHTML = ''; $('body').innerHTML = '<div id="msg" class="' + (err ? 'err' : '') + '">' + (spin ? ROTOR : '') + t + '</div>'; $('tabs').innerHTML = ''; }
  function render() {
    var it = DATA[CUR]; TABS = buildTabs(it); if (TAB >= TABS.length) TAB = 0;
    $('tabs').innerHTML = TABS.map(function (x, i) { return '<button data-i="' + i + '" class="' + (i === TAB ? 'on' : '') + '"><i class="' + x.sev + '"></i>' + esc(x.title) + '</button>'; }).join('');
    $('hero').innerHTML = '<h2>' + esc(it.name) + '</h2><span class="badge b-' + (TABS[0].sev) + '">' + (SL[TABS[0].sev] || '') + '</span>';
    var t = TABS[TAB]; $('body').innerHTML = t.html;
    var box = $('body').querySelector('.figs');
    if (box) t.figs.forEach(function (fn) { try { fn(box); } catch (e) { var d = document.createElement('div'); d.className = 'small'; d.textContent = 'Diagramm uebersprungen (' + e.message + ')'; box.appendChild(d); console.error(e); } });
    window.scrollTo(0, 0);
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; TAB = +b.dataset.i; render(); });
  window.addEventListener('resize', function () { clearTimeout(window.__rz); window.__rz = setTimeout(function () { if (DATA) render(); }, 250); });

  function analyze(file) {
    $('fname').textContent = file.name;
    msg('Lese ' + esc(file.name) + ' ...', 0, 1);
    var rd = new FileReader();
    rd.onerror = function () { msg('Datei konnte nicht gelesen werden.', 1); };
    rd.onload = function () {
      msg('Dekodiere und analysiere ' + esc(file.name) + ' &ndash; das dauert je nach Loggroesse einige Sekunden ...', 0, 1);
      if (worker) worker.terminate();
      worker = new Worker(window.__WORKER_URL__);
      worker.onmessage = function (e) {
        var d = e.data;
        if (d.progress) { var s = document.querySelector('#msg'); if (s) s.lastChild.textContent = d.progress; return; }
        worker.terminate(); worker = null;
        if (d.error) { msg(esc(d.error), 1); return; }
        DATA = d.done; CUR = 0; TAB = 0;
        var s = $('flight'); s.innerHTML = DATA.map(function (x, i) { return '<option value="' + i + '">' + esc(x.name) + '</option>'; }).join('');
        s.style.display = DATA.length > 1 ? '' : 'none'; render();
      };
      worker.onerror = function (e) { msg('Fehler: ' + esc(e.message || e), 1); };
      worker.postMessage({ buf: rd.result, name: file.name, cells: +$('cells').value || 0 }, [rd.result]);
    };
    rd.readAsArrayBuffer(file);
  }
  $('file').onchange = function () { if (this.files[0]) analyze(this.files[0]); };
  $('flight').onchange = function () { CUR = +this.value; TAB = 0; render(); };
  $('cells').onchange = function () { var f = $('file').files[0]; if (f && DATA) analyze(f); };
  window.__rf = { analyze: analyze };
})();

</script></body></html>
